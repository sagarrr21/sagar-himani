<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090707">

  <title>Private · Sagar & Himani</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 35%,
          #29181b 0%,
          #110b0c 45%,
          #050505 100%
        );

      color: #f8eeee;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: min(440px, 100%);
      padding: 48px 34px;
      text-align: center;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.045);

      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5);

      backdrop-filter: blur(12px);
    }

    .heart {
      font-size: 38px;
      margin-bottom: 18px;
      color: #e6a3ac;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #c8aeb1;
    }

    .title {
      font-size: 42px;
      font-weight: 400;
      margin: 14px 0 10px;
    }

    .subtitle {
      color: #bcaeb0;
      line-height: 1.7;
      margin: 0 0 30px;
    }

    .password-box {
      width: 100%;
    }

    input {
      width: 100%;
      padding: 15px 16px;

      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);

      background: rgba(0, 0, 0, 0.3);

      color: white;
      font-size: 16px;

      outline: none;
    }

    input::placeholder {
      color: #817578;
    }

    input:focus {
      border-color: #c98b94;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #f1d6d9;
      color: #241416;

      font-weight: 700;
      font-size: 15px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0);
    }

    #error {
      min-height: 20px;
      margin-top: 12px;

      color: #e9a2aa;

      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .note {
      margin-top: 28px;

      color: #766a6c;

      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .lock {
      margin-top: 24px;
      font-size: 12px;
      color: #665b5d;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="heart">♥</div>

    <div class="eyebrow">
      A PRIVATE LITTLE PLACE
    </div>

    <h1 class="title">
      Sagar & Himani
    </h1>

    <p class="subtitle">
      Some stories are meant to be shared only
      with the people who matter.
    </p>

    <form id="gate" class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >

      <button type="submit">
        Unlock Our Story
      </button>

    </form>

    <div id="error"></div>

    <div class="note">
      OUR STORY · PRIVATE ACCESS
    </div>

    <div class="lock">
      🔒 This little place is just for us.
    </div>

  </main>

  <script>

    /*
      ==============================
      YOUR WEBSITE PASSWORD
      ==============================
    */

    const PASSWORD = "SH1690";


    /*
      ==============================
      CHECK PASSWORD
      ==============================
    */

    document
      .getElementById("gate")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const enteredPassword =
          document.getElementById("password").value;

        const error =
          document.getElementById("error");


        if (enteredPassword === PASSWORD) {

          // Remember that this browser has unlocked the story.
          sessionStorage.setItem(
            "storyUnlocked",
            "yes"
          );

          // Open the actual Sagar & Himani website.
          window.location.href = "story.html";

        } else {

          error.textContent =
            "That password is not correct. Try again.";

          document.getElementById("password").value = "";

          document
            .getElementById("password")
            .focus();
        }

      });

  </script>

</body>
</html>
